<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Controller Symptom Checker | ZBTips</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=controller-lab-promo" />
  <script async src="https://js.stripe.com/v3/buy-button.js"></script>
</head>
<body>
  <div class="page-glow page-glow-left" aria-hidden="true"></div>
  <div class="page-glow page-glow-right" aria-hidden="true"></div>

  <main class="app-shell">
    <header class="hero-panel">
      <div class="hero-top">
        <div class="hero-brand">
          <img src="logo.png" alt="ZBTips logo" class="hero-logo" />
          <div class="hero-copy">
            <p class="eyebrow">Fortnite Zero Build</p>
            <h1 class="app-title">Controller Symptom Checker</h1>
            <p class="subhead">Pick what feels wrong. Get the first settings to test. Stop changing random stuff.</p>
          </div>
        </div>
        <button id="homeButton" class="ghost-button hero-home" type="button">Home</button>
      </div>

      <div class="hero-strip">
        <span class="hero-chip hero-chip-purple">Symptom-first</span>
        <span class="hero-chip hero-chip-cyan">Controller only</span>
        <span class="hero-chip">Zero Build</span>
      </div>
    </header>

    <section id="app" aria-live="polite"></section>

    <footer class="footer">
      <p>Built for controller players who want answers faster than menu scrolling.</p>
    </footer>
  </main>

  <script src="app.js?v=controller-lab-promo"></script>
</body>
</html>
