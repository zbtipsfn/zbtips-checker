<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZBTips Controller Symptom Checker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand-block">
        <img src="logo.png" alt="ZBTips" class="brand-logo" />
        <div class="brand-copy">
          <p class="eyebrow">Fortnite Zero Build</p>
          <h1>ZBTips Controller Symptom Checker</h1>
          <p class="subhead">Pick what feels wrong. Get the first settings to test. Stop changing random stuff.</p>
        </div>
      </div>
      <div class="topbar-actions">
        <button id="homeButton" class="ghost-button" type="button">Home</button>
      </div>
    </header>

    <section id="app" aria-live="polite"></section>

    <footer class="footer">
      <p>Built for controller players who want answers faster than menu scrolling.</p>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
